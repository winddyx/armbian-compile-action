name: 'Armbian/build'
description: 'Armbian Linux build framework'
inputs:
  board:
    required: false
    default: 'nanopineo'
  distro:
    required: false
    default: 'debian'
  suite:
    required: false
    default: 'trixie'
  flavor:
    required: false
    default: 'cli'
  kernel_branch:
    required: false
    default: 'edge'
  armbian_ref:
    required: false
    default: 'v26.5.1'
  artifacts:
    required: false
    default: 'true'
  release-id:
    required: false
  github-token:
    required: false
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: armbian/build
        ref: ${{ inputs.armbian_ref }}
        path: build
    - name: Setup QEMU binfmt
      shell: bash
      run: |
        docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || {
          echo "::warning::QEMU binfmt setup failed — cross-compilation may not work"
        }
    - name: Set env
      shell: bash
      run: |
        if [ -n "${{ inputs.suite }}" ]; then
          echo "release=${{ inputs.suite }}" >> $GITHUB_ENV
        else
          case ${{ inputs.distro }} in
            debian)
              echo "release=bullseye" >> $GITHUB_ENV
              ;;
            ubuntu)
              echo "release=jammy" >> $GITHUB_ENV
              ;;
            *)
              echo "Unknown distro '${{ inputs.distro }}' and no 'suite' specified!" >&2
              exit 1
              ;;
          esac
        fi
        if [ ${{ inputs.flavor }} == "cli" ]
        then
          echo "build-minimal=yes" >> $GITHUB_ENV
          echo "build-desktop=no" >> $GITHUB_ENV
          echo "desktop-environment=" >> $GITHUB_ENV
          echo "desktop-environment-config-name=" >> $GITHUB_ENV
        else
          echo "build-minimal=no" >> $GITHUB_ENV
          echo "build-desktop=yes" >> $GITHUB_ENV
          case ${{ inputs.flavor }} in
            kde)
              echo "desktop-environment=kde-plasma" >> $GITHUB_ENV
              ;;
            *)
              echo "desktop-environment=${{ inputs.flavor }}" >> $GITHUB_ENV
              ;;
          esac
          echo "desktop-environment-config-name=config_base" >> $GITHUB_ENV
        fi
    - name: Build
      shell: bash
      run: |
        echo "::group::🔧 Armbian build config"
        echo "Armbian ref:   ${{ inputs.armbian_ref }}"
        echo "Board:         ${{ inputs.board }}"
        echo "Kernel branch: ${{ inputs.kernel_branch }}"
        echo "Release:       ${{ env.release }}"
        echo "Minimal build: ${{ env.build-minimal }}"
        echo "Desktop:       ${{ env.build-desktop }}"
        echo "Flavor:        ${{ inputs.flavor }}"
        echo "Output image:  ${{ inputs.board }}_${{ inputs.distro }}_${{ inputs.flavor }}"
        echo "::endgroup::"
        cd ./build
        ./compile.sh \
        PREFER_DOCKER=yes \
        BOARD=${{ inputs.board }} \
        BRANCH=${{ inputs.kernel_branch }} \
        RELEASE=${{ env.release }} \
        BUILD_MINIMAL=${{ env.build-minimal }} \
        BUILD_DESKTOP=${{ env.build-desktop }} \
        KERNEL_CONFIGURE=no \
        REWRITE_PATCHES=yes \
        DESKTOP_ENVIRONMENT=${{ env.desktop-environment }} \
        DESKTOP_ENVIRONMENT_CONFIG_NAME=${{ env.desktop-environment-config-name }} \
        DESKTOP_APPGROUPS_SELECTED=none \
        EXPERT=yes \
        COMPRESS_OUTPUTIMAGE=sha,xz
    - name: Upload artifacts
      if: inputs.artifacts == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.board }}_${{ inputs.distro }}_${{ inputs.flavor }}
        path: ./build/output/images/*
    - name: Upload
      if: inputs.release-id != '' && inputs.github-token != ''
      uses: xresloader/upload-to-github-release@v1
      env:
          GITHUB_TOKEN: ${{ inputs.github-token }}
      with:
        release_id: ${{ inputs.release-id }}
        file: ./build/output/images/*
    - name: Rollback release
      if: failure() && inputs.release-id != '' && inputs.github-token != ''
      uses: author/action-rollback@stable
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      with:
        release_id: ${{ inputs.release-id }}
